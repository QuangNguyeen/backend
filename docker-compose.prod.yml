services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [web]

  web:
    image: ghcr.io/${GHCR_OWNER}/dictalearn-backend:${IMAGE_TAG:-latest}
    restart: unless-stopped
    env_file: .env
    environment:
      RUN_MIGRATIONS: "1"
      # 4 vCPU dùng chung với Celery (STT): 2 web async là đủ, chừa CPU cho transcribe.
      UVICORN_WORKERS: "2"
    mem_limit: 1500m
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 5
    expose: ["8000"]
    volumes:
      # Import (Layer 1/2 transcript fetch) runs in web and needs the cookies to
      # pull captions from YouTube on a datacenter IP. Read-only; yt-dlp uses a
      # /tmp copy (see _writable_cookie_file).
      - ./secrets/cookies.txt:/app/cookies.txt:ro

  worker:
    image: ghcr.io/${GHCR_OWNER}/dictalearn-backend:${IMAGE_TAG:-latest}
    restart: unless-stopped
    env_file: .env
    environment:
      RUN_MIGRATIONS: "0"
    # concurrency=2: tối đa 2 transcription song song — vừa với 8 GB; mỗi child nạp spaCy +
    # libs STT nên 3 dễ gây OOM khi xử lý video dài. max-tasks-per-child để giải phóng RAM rò rỉ.
    command: >
      celery -A app.celery_app.celery worker
      --loglevel=info --pool=prefork --concurrency=2 --max-tasks-per-child=20
    mem_limit: 4g
    volumes:
      # Read-only so the pipeline never writes rotated cookies back to the
      # source — yt-dlp uses a throwaway /tmp copy (see _writable_cookie_file).
      - ./secrets/cookies.txt:/app/cookies.txt:ro
      - ./secrets/gcp-credentials.json:/app/gcp-credentials.json:ro
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_healthy }

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    command: >
      postgres
      -c max_connections=100
      -c shared_buffers=512MB
      -c effective_cache_size=2GB
      -c work_mem=16MB
      -c maintenance_work_mem=128MB
    mem_limit: 1500m
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --maxmemory 384mb --maxmemory-policy allkeys-lru --appendonly yes
    mem_limit: 600m
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # --- Observability (xem §7.5 DEPLOY_OPTION_A.md) ---
  dozzle:
    image: amir20/dozzle:latest
    restart: unless-stopped
    environment:
      DOZZLE_NO_ANALYTICS: "true"
      DOZZLE_FILTER: "label=com.docker.compose.project"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    expose: ["8080"]

  uptime-kuma:
    image: louislam/uptime-kuma:1
    restart: unless-stopped
    volumes:
      - uptime_data:/app/data
    expose: ["3001"]

volumes:
  caddy_data:
  caddy_config:
  pgdata:
  redis_data:
  uptime_data: