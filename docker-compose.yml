# Local development stack: Postgres + Redis + API + Celery worker.
# Production uses docker-compose.prod.yml (Caddy, GHCR images, observability).
#
#   cp .env.example .env        # fill in API keys
#   docker compose up --build   # api on http://localhost:8000
#
# DB/Redis hostnames are overridden below to the compose service names, so the
# DATABASE_URL/REDIS_URL in your .env (localhost) don't need changing.

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-dictalearn}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-dictalearn}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build: .
    image: dictalearn-backend:dev
    restart: unless-stopped
    env_file: .env
    environment:
      RUN_MIGRATIONS: "1"
      UVICORN_WORKERS: "1"
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-dictalearn}
      REDIS_URL: redis://redis:6379/0
    ports:
      - "8000:8000"
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 5

  worker:
    build: .
    image: dictalearn-backend:dev
    restart: unless-stopped
    env_file: .env
    environment:
      # Only the web container runs migrations (avoids a startup race).
      RUN_MIGRATIONS: "0"
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-dictalearn}
      REDIS_URL: redis://redis:6379/0
    command: >
      celery -A app.celery_app.celery worker
      --loglevel=info --pool=prefork --concurrency=2
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_healthy }

volumes:
  pgdata:
  redis_data: